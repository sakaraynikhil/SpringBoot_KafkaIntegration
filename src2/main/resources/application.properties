spring.application.name=ReceiveService

#Configuration of the port number
server.port = 0


#Configuration of the Consumer kafka
spring.kafka.consumer.bootstrap-servers = localhost:9092
spring.kafka.consumer.key-deserializer= org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

#The actual value format that should be allowed
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class =org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class  = org.springframework.kafka.support.serializer.JacksonJsonDeserializer


spring.kafka.consumer.group-id=product-events-receiver
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=receive.ReceiveService.Events.ProductEvent

#Configuration of mysql database
spring.datasource.url = jdbc:mysql://localhost:3306/company
spring.datasource.username = root
spring.datasource.password = password
